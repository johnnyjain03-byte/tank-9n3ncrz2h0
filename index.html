<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gym Bro</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gym Bro">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F4F6FB">
<meta name="color-scheme" content="light only">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Manrope:wght@500;600;700;800&display=swap">
<style>
/* Layout: one phone column, light only, big readable type; each tab has its own bright colour (orange Today, blue Gym, green Food, violet Progress) */
:root{
  --bg:#F4F6FB; --surface:#FFFFFF; --soft:#EEF1F7; --ink:#0D1220; --muted:#3F4A5E; --line:#DCE1EC;
  --orange:#F0500F; --orange-soft:#FFE7DC; --blue:#1F5BEF; --blue-soft:#E1E9FF; --green:#0B9A5E; --green-soft:#D9F5E7;
  --violet:#6D2FE0; --violet-soft:#EEE6FF; --sun:#FFCB2B; --sun-soft:#FFF4CF; --red:#D9192E; --red-soft:#FFE1E5;
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:18px;
  color-scheme:light only;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:500 17px/1.55 var(--body);-webkit-font-smoothing:antialiased}
img{max-width:100%}
[hidden]{display:none!important}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
#app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(110px + env(safe-area-inset-bottom,0px))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:14px 10px}
.brand{font:800 22px/1.1 var(--body);flex:1;min-width:0}
.brand small{display:block;font:600 14px/1.3 var(--body);color:var(--muted);margin-top:2px}
.chip{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:800;font-size:15px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.chip .dot{width:10px;height:10px;border-radius:50%;background:var(--green)}
.chip.travel .dot{background:var(--blue)} .chip.sick .dot{background:var(--red)} .chip.break .dot{background:var(--sun)}
main{display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0;box-shadow:0 1px 2px rgba(13,18,32,.06)}
h2{font:800 23px/1.2 var(--body);margin:0;text-wrap:balance}
h3{font:800 19px/1.25 var(--body);margin:0}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:15px}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.big{font:700 42px/1 var(--display);font-variant-numeric:tabular-nums}
.big small{font:700 17px var(--body);color:var(--muted);margin-left:4px}
.lbl{font-size:14px;font-weight:800;color:var(--muted)}
.bar{height:12px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--orange)}
.bar.green>i{background:var(--green)} .bar.red>i{background:var(--red)} .bar.blue>i{background:var(--blue)}
.btn{border:0;border-radius:14px;padding:15px 18px;font-weight:800;font-size:17px;background:var(--orange);color:#fff;text-align:center;display:inline-block}
.btn.blue{background:var(--blue)} .btn.green{background:var(--green)} .btn.violet{background:var(--violet)}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.small{padding:10px 14px;font-size:15px;border-radius:12px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
input[type=text],input[type=time],input[type=date],input:not([type]),select{background:var(--soft);border:2px solid transparent;border-radius:12px;padding:12px;min-width:0;width:100%;font-size:17px;color:var(--ink)}
input[type=time],input[type=date]{-webkit-appearance:none;appearance:none;display:block;max-width:100%;min-height:50px;text-align:left}
input::-webkit-date-and-time-value{text-align:left}
input:focus,select:focus{border-color:var(--blue);outline:none}
input::placeholder{color:#7A8499}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field span{font-size:14px;font-weight:700;color:var(--muted)}
/* Gym Bro */
.hero{background:var(--sun);border-radius:var(--r);padding:14px 16px;display:flex;gap:12px;align-items:center;color:#1A1405}
.hero.angry{background:#FFB199} .hero.happy{background:#A8EBC9} .hero.soft{background:#C9D8FF}
.face{background:none;border:0;padding:0;flex:none;line-height:0}
.face svg{width:104px;height:104px}
.hero .say{flex:1;min-width:0}
.hero .say b{display:block;font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;opacity:.7}
.hero .say p{font:800 19px/1.3 var(--body);text-wrap:pretty}
.hero .say i{display:block;font-style:normal;font-size:13px;font-weight:700;opacity:.6;margin-top:4px}
.talk{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;margin-top:-6px;scrollbar-width:none}
.talk button{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 14px;font-weight:800;font-size:15px;white-space:nowrap}
.tip{display:flex;gap:10px;align-items:center;background:var(--sun-soft);border:0;border-radius:15px;padding:10px 14px;text-align:left;width:100%}
.tip svg{width:52px;height:52px;flex:none}
.tip span{font-weight:700;font-size:15px}
.eyes{transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:no-preference){
  .face svg{animation:bob 3s ease-in-out infinite}
  .eyes{animation:blink 5s infinite}
  .face.jump svg{animation:jump .45s ease-out}
  .hero.angry .face svg{animation:shake .5s ease-in-out 2}
  @keyframes bob{50%{transform:translateY(-3px)}}
  @keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
  @keyframes jump{0%{transform:translateY(0) scale(1)}40%{transform:translateY(-14px) scale(1.06)}100%{transform:translateY(0) scale(1)}}
  @keyframes shake{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
}
/* tasks */
.tasks{display:flex;flex-direction:column;gap:10px}
.task{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 15px;border-radius:15px;background:var(--soft)}
.tmain{flex:1;min-width:0;display:flex;align-items:center;gap:14px;background:none;border:0;padding:9px 0;text-align:left}
.q{width:42px;height:42px;border-radius:50%;border:2px solid var(--line);background:var(--surface);font-weight:800;font-size:18px;color:var(--blue);flex:none}
.box{width:32px;height:32px;border-radius:10px;border:3px solid #8C96AA;flex:none;display:grid;place-items:center;background:var(--surface)}
.box svg{width:20px;height:20px;stroke:#fff;stroke-width:3.5;fill:none;opacity:0}
.task.done{background:var(--green-soft)}
.task.done .box{background:var(--green);border-color:var(--green)}
.task.done .box svg{opacity:1}
.t{flex:1;min-width:0}
.t b{display:block;font-weight:800;font-size:17px}
.t span{display:block;font-size:14px;color:var(--muted)}
.streak{background:var(--orange-soft);color:var(--orange);font-weight:800;font-size:15px;padding:6px 12px;border-radius:999px}
/* banners */
.banner{border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.banner.sick{background:var(--red-soft)} .banner.travel{background:var(--blue-soft)} .banner.break{background:var(--sun-soft)} .banner.warn{background:var(--orange-soft)} .banner.good{background:var(--green-soft)}
/* segmented */
.segs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.segs::-webkit-scrollbar,.talk::-webkit-scrollbar{display:none}
.seg{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 15px;font-weight:800;font-size:15px;white-space:nowrap}
.seg.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tab-train .seg.on{background:var(--blue);border-color:var(--blue)}
.tab-food .seg.on{background:var(--green);border-color:var(--green)}
.tab-me .seg.on{background:var(--violet);border-color:var(--violet)}
/* gym */
.steps{counter-reset:s;display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.steps li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start}
.steps li::before{content:counter(s);width:34px;height:34px;border-radius:50%;background:var(--blue);color:#fff;font-weight:800;display:grid;place-items:center}
.steps li b{display:block}
.ex{border-radius:15px;background:var(--soft);padding:14px;display:flex;flex-direction:column;gap:10px}
.ex.main{background:var(--blue-soft)}
.ex-top{display:flex;gap:10px;align-items:flex-start}
.exname{background:none;border:0;padding:0;text-align:left;flex:1;min-width:0}
.exname b{display:block;font-size:17px;font-weight:800}
.exname span{font-size:15px;color:var(--muted);font-weight:700}
.tag{font-size:12px;font-weight:800;background:var(--blue);color:#fff;padding:3px 8px;border-radius:6px;white-space:nowrap}
.ex-log{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}
.ex-log input{text-align:center;font-weight:800}
.hit{height:50px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:800;font-size:15px}
.hit.ok{background:var(--green);border-color:var(--green);color:#fff}
.hit.miss{background:var(--orange);border-color:var(--orange);color:#fff}
.how{font-size:15px;display:flex;flex-direction:column;gap:6px}
.how ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.linkbtn{border:0;background:none;padding:0;color:var(--blue);font-weight:800;font-size:15px;text-align:left}
.tab-food .linkbtn{color:var(--green)}
.vid{font-weight:800;color:var(--red);font-size:15px}
.helpex{border-top:1px solid var(--line);padding-top:10px}
.sched{background:none;border:0;padding:0;text-align:left;font-weight:inherit;color:var(--blue);text-decoration:underline;text-underline-offset:3px}
/* meals */
.meal{border-radius:15px;background:var(--soft);overflow:hidden}
.meal-h{display:flex;gap:12px;align-items:flex-start;padding:14px}
.meal-h .t .slot{display:flex;gap:6px;flex-wrap:wrap;font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.meal-h .t .slot i{font-style:normal;background:var(--green);color:#fff;border-radius:6px;padding:1px 7px;text-transform:none;letter-spacing:0}
.meal-h .t .slot i.hot{background:var(--orange)} .meal-h .t .slot i.cold{background:var(--blue)}
.meal-h .t b{font-size:17px;line-height:1.3}
.meal-h .t em{display:block;font-style:normal;font-size:14px;color:var(--muted)}
.mac{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:14px;font-weight:700;color:var(--muted);margin-top:6px}
.mac b{color:var(--ink);display:inline;font-size:14px}
.mac .sug{color:#B4235A}
.meal.done{background:var(--green-soft)}
.eat{width:48px;height:48px;border-radius:14px;border:3px solid #8C96AA;background:var(--surface);flex:none;display:grid;place-items:center}
.eat svg{width:22px;height:22px;stroke:#8C96AA;stroke-width:3.5;fill:none}
.meal.done .eat{background:var(--green);border-color:var(--green)} .meal.done .eat svg{stroke:#fff}
.meal-act{display:flex;gap:16px;margin-top:8px}
.recipe{padding:0 14px 16px;display:flex;flex-direction:column;gap:10px;font-size:16px}
.recipe ul,.recipe ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:4px}
.minis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mini{background:var(--soft);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:4px}
.mini b{font-size:18px} .mini span{font-size:13px;font-weight:800;color:var(--muted)}
.mini .bar{height:8px}
table{width:100%;border-collapse:collapse;font-size:16px}
td,th{padding:10px 4px;text-align:left;border-top:1px solid var(--line);vertical-align:top}
th{font-size:13px;color:var(--muted);border-top:0}
.shop{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line)}
.shop .tick{display:flex;align-items:center;gap:12px;padding:12px 0;flex:1;min-width:0;background:none;border:0;text-align:left}
.shop .box{width:28px;height:28px;border-radius:8px}
.shop.got .box{background:var(--green);border-color:var(--green)} .shop.got .box svg{opacity:1;width:16px;height:16px}
.shop.got .t{color:var(--muted);text-decoration:line-through}
.shop .t{font-weight:700} .shop .qty{font-weight:800;color:var(--muted);white-space:nowrap}
.shop .x{width:34px;height:34px;border-radius:50%;border:0;background:var(--soft);color:var(--muted);font-weight:800;flex:none}
.aisle{font-size:14px;font-weight:800;color:var(--green);margin-top:8px}
.pchips{display:flex;flex-wrap:wrap;gap:8px}
.pchip{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 13px;font-weight:700;font-size:15px}
.painscale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.painscale .seg{padding:10px 0;text-align:center}
.painscale .seg.on{background:var(--red);border-color:var(--red);color:#fff}
.pchip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.pchip.no{background:var(--red-soft);border-color:var(--red);color:var(--red);text-decoration:line-through}
/* goal */
.goal{background:var(--violet);color:#fff;border:0;text-align:left}
.goal .lbl{color:#fff;opacity:.9}
.goal .date{font:700 36px/1.05 var(--display);text-wrap:balance}
.goal .bar{background:rgba(255,255,255,.3)} .goal .bar>i{background:#fff}
.gchips{display:flex;flex-wrap:wrap;gap:8px}
.gchips span{background:var(--violet-soft);color:var(--violet);font-weight:800;font-size:14px;padding:6px 11px;border-radius:999px}
/* photos */
.ba{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ba figure{margin:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.ba img,.ba .ph{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:14px;background:var(--soft);display:grid;place-items:center;color:var(--muted);font-size:15px;font-weight:700;text-align:center;padding:8px}
.ba img{padding:0}
.ba figcaption{font-size:15px}
.gal{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.gal div{position:relative}
.gal img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;display:block}
.gal span{position:absolute;left:4px;bottom:4px;font-size:11px;font-weight:800;background:rgba(0,0,0,.65);color:#fff;padding:2px 5px;border-radius:5px}
.gal button{position:absolute;right:3px;top:3px;min-width:26px;height:26px;border-radius:13px;border:0;background:rgba(0,0,0,.65);color:#fff;font-weight:800;line-height:1;font-size:13px}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
/* chart */
svg.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .cl{fill:var(--muted);font:700 11px var(--body)}
.chart .raw{fill:#8C96AA}
.chart .raw.ex{fill:none;stroke:#8C96AA;stroke-width:1}
.chart .avg{fill:none;stroke:var(--violet);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.chart .end{fill:var(--violet)}
.chart .gl{stroke:var(--green);stroke-dasharray:5 4;stroke-width:2}
.chart .gt{fill:var(--green);font:800 11px var(--body)}
details summary{cursor:pointer;font-weight:800;font-size:17px;list-style:none;display:flex;justify-content:space-between;align-items:center}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"+";color:var(--muted);font-size:24px;line-height:1} details[open] summary::after{content:"–"}
details[open] summary{margin-bottom:12px}
/* nav */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{border:0;background:none;padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px;font-weight:800;color:#6B7487}
.tabs svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on[data-v=today]{color:var(--orange)} .tabs button.on[data-v=train]{color:var(--blue)} .tabs button.on[data-v=food]{color:var(--green)} .tabs button.on[data-v=me]{color:var(--violet)}
#sheet{position:fixed;inset:0;z-index:20;background:rgba(5,8,12,.5);display:flex;align-items:flex-end;justify-content:center}
#sheet .in{background:var(--bg);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:20px max(16px,env(safe-area-inset-left,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px;max-height:90vh;overflow-y:auto}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:15px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:2px}
.opt.on{border-color:var(--orange);background:var(--orange-soft)}
.opt b{font-weight:800;font-size:17px} .opt span{font-size:15px;color:var(--muted)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:#fff;padding:13px 18px;border-radius:14px;font-weight:800;font-size:16px;max-width:calc(100% - 32px);text-align:center}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
.chip.extra .dot{background:var(--violet)} .banner.extra{background:var(--violet-soft)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--soft);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font:700 26px/1.1 var(--display);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;font-weight:800;color:var(--muted)} .stat em{font-style:normal;font-size:13px;color:var(--muted)}
.frow{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding:10px 0}
.frow .t b{font-size:16px} .frow .t span{font-size:14px}
.qbtn{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:var(--surface);font-weight:800;font-size:18px;flex:none;line-height:1;padding:0}
.qn{min-width:34px;text-align:center;font-weight:800}
.burn{background:var(--orange-soft);border-radius:12px;padding:10px 12px;font-size:15px}
.burn b{color:var(--orange)}
.src{font-size:15px;display:flex;flex-direction:column;gap:8px;padding-left:20px;margin:0}
.src a{color:var(--blue);font-weight:700}
.code{font:600 13px/1.4 ui-monospace,Menlo,monospace;background:var(--soft);border-radius:10px;padding:10px;word-break:break-all;-webkit-user-select:all;user-select:all}
.blk{border-radius:15px;background:var(--soft);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.blk.done{background:var(--green-soft)} .blk.skip{opacity:.6}
.blk .time{font:700 20px/1 var(--display);color:var(--violet)}
.sug-list{display:flex;flex-direction:column;gap:6px}
.sug-list button{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;text-align:left;display:flex;justify-content:space-between;gap:10px;align-items:center}

function tankMood() {

  const tasks = tasksFor(k), done = tasks.filter(t => isDone(k, t)).length;
  const seed = parseKey(k).getDate() + h, qn = quietGap();
  const fill = s => s.replace('{n}', qn).replace('{sleep}', S.core.settings.sleep);
  if (qn) return { mood: 'angry', msg: fill(pick(TANK.quiet, seed)) };
  if (mode === 'sick') return { mood: 'soft', msg: pick(TANK.sick, seed) };
  if (done === tasks.length) return { mood: 'happy', msg: pick(TANK.done, seed) };
  const hw = healthWarn(); if (hw) return { mood: 'soft', msg: hw };
  if (mode === 'extra') return { mood: 'neutral', msg: pick(TANK.extra, seed) };
  if (mode === 'travel') return { mood: 'neutral', msg: pick(TANK.travel, seed) };
  if (mode === 'break') return { mood: 'neutral', msg: pick(TANK.break, seed) };
  const lk = tankLook();
  if (lk === 'fat' && h >= 9) return { mood: 'grumpy', msg: pick(TANK.fat, seed) };
  if (lk === 'skinny' && h >= 9) return { mood: 'soft', msg: pick(TANK.skinny, seed) };
  if (lk === 'strong' && h >= 9 && h < 12) return { mood: 'happy', msg: pick(TANK.strong, seed) };
  const train = tasks.find(t => t.id === 'train');
  if (train && !isDone(k, train) && mins > toMin(planTime(k)) + 60) return { mood: 'angry', msg: pick(TANK.gymlate, seed) };
  if (h < 11) return { mood: 'neutral', msg: pick(TANK.morning, seed) };
  if (train && !isDone(k, train) && h >= 15) return { mood: 'grumpy', msg: pick(TANK.gymdue, seed) };
  if (h >= 20 && !(getDay(ciKey()) || {}).ci) return { mood: 'grumpy', msg: pick(TANK.checkin, seed) };
  if (h >= 20) return { mood: done / tasks.length < 0.5 ? 'angry' : 'grumpy', msg: fill(pick(TANK.evening, seed)) };

function niceQty(q, u) {

  if (rate === null) rows.push({ ok: 'wait', t: 'Weight', d: 'Needs 2 weeks of morning weigh-ins.' });

  const ms = S.core.measurements.filter(m => m.d >= since).sort((a, b) => a.d < b.d ? -1 : 1);
  if (ms.length >= 2) { const dw = ms[ms.length - 1].waist - ms[0].waist; rows.push({ ok: G.rate > 0 ? (dw <= 1 ? 'good' : 'meh') : dw < -0.4 ? 'good' : dw <= 0.4 ? 'meh' : 'bad', t: 'Waist', d: `${dw >= 0 ? '+' : ''}${dw.toFixed(1)} cm in 4 weeks.` }); }
  else rows.push({ ok: 'wait', t: 'Waist', d: 'Measure on Sundays: 2 measurements needed.' });
  let plan = 0, done = 0;
  for (let x = since; x < k; x = addDays(x, 1)) { const d = getDay(x) || { t: {} }; if (SESS[planFor(x)] && (d.mode || 'normal') === 'normal') { plan++; if (d.t.train || d.session) done++; } }

function chart(series, goal) {
  if (series.length < 2) return '<p class="small muted">Two weigh-ins and your chart appears.</p>';
  const pts = series.slice(-60), clean = series.filter(x => !x.ex);
  const first = pts[0].k, last = pts[pts.length - 1].k, span = Math.max(1, diffDays(last, first));
  const ws = pts.map(p => p.w).concat([goal]);
  const lo = Math.floor(Math.min(...ws) - 0.5), hi = Math.ceil(Math.max(...ws) + 0.5);
  const W = 340, H = 170, L = 36, Rr = 10, Tp = 12, B = 24;
  const x = k => L + diffDays(k, first) / span * (W - L - Rr);
  const y = w => Tp + (hi - w) / (hi - lo) * (H - Tp - B);
  const avg = pts.filter(p => !p.ex).map(p => [p.k, trendAt(p.k, clean)]).filter(p => p[1] !== null);
  const path = avg.map((p, i) => (i ? 'L' : 'M') + x(p[0]).toFixed(1) + ' ' + y(p[1]).toFixed(1)).join(' ');
  const end = avg[avg.length - 1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight trend">
    ${[lo, (lo + hi) / 2, hi].map(t => `<line class="grid" x1="${L}" x2="${W - Rr}" y1="${y(t)}" y2="${y(t)}"/><text class="cl" x="${L - 5}" y="${y(t) + 4}" text-anchor="end">${t.toFixed(1)}</text>`).join('')}
    <line class="gl" x1="${L}" x2="${W - Rr}" y1="${y(goal)}" y2="${y(goal)}"/><text class="gt" x="${W - Rr}" y="${y(goal) - 5}" text-anchor="end">goal ${goal}</text>
    ${pts.map(p => `<circle class="raw ${p.ex ? 'ex' : ''}" cx="${x(p.k).toFixed(1)}" cy="${y(p.w).toFixed(1)}" r="3"/>`).join('')}
    ${avg.length > 1 ? `<path class="avg" d="${path}"/>` : ''}
    ${end ? `<circle class="end" cx="${x(end[0]).toFixed(1)}" cy="${y(end[1]).toFixed(1)}" r="5"/>` : ''}
    <text class="cl" x="${L}" y="${H - 6}">${shortDate(first)}</text><text class="cl" x="${W - Rr}" y="${H - 6}" text-anchor="end">${shortDate(last)}</text>
  </svg><p class="small muted">Dots: daily weigh-ins. Line: 7-day average. Watch the line.</p>`;
}

        const nu = x.nutriments, sq = +x.serving_quantity > 0 && +x.serving_quantity < 1000 ? Math.round(+x.serving_quantity) : 0;
        return { n: x.product_name + (x.brands ? ' · ' + x.brands.split(',')[0] : ''), k100: +nu['energy-kcal_100g'], p100: +nu.proteins_100g || 0, f100: +nu.fat_100g || 0, c100: +nu.carbohydrates_100g || 0, s100: +nu.sugars_100g || 0, sq, ss: x.serving_size || '' };
      });
    } catch (e) { F.err = 'No connection to the food database. Enter it yourself instead.'; }
    F.loading = false; if (UI.sheet && UI.sheet.food === F) render();
  },
  foPick(el) {
    const F = UI.sheet.food, r = F.res[+el.dataset.v], g = r.sq || 100, m = g / 100;
    const f = { id: 'my:' + Date.now().toString(36), n: r.n, por: r.sq ? (r.ss || g + ' g') : '100 g', k: Math.round(r.k100 * m), p: Math.round(r.p100 * m), fat: Math.round(r.f100 * m), c: Math.round(r.c100 * m), s: Math.round(r.s100 * m) };
    S.core.myFoods.push(f); if (S.core.myFoods.length > 200) S.core.myFoods.shift();
    F.items.push({ id: f.id, q: 1, alts: [f.id] }); F.view = 'main'; F.miss = []; saveCore(); render();
  },
  faSave() {
    const F = UI.sheet.food, d = todayDay(); d.food = d.food || [];
    let tot = 0;
    F.items.forEach(it => { const f = itemFood(it); if (!f) return; const rec = foodRec(f, it.q, { fid: it.id, exact: 1 }); tot += rec.k; d.food.push(rec); S.core.recentFoods = [it.id].concat(S.core.recentFoods.filter(x => x !== it.id)).slice(0, 12); });
    UI.sheet = null; touch(); saveCore(); render();
    toast(tot > 600 ? 'Gym Bro: "' + fmt(tot) + ' kcal? I saw that."' : '+' + fmt(tot) + ' kcal added', 3000);
  },
  // budget
  bRegion(el) { const b = S.core.budget, v = el.dataset.v; b.country = val('b-country') || b.country; if (b.region !== v) { b.region = v; b.weekly = 0; b.tier = ''; b.ref = null; b.alert = null; b.supp = 0; } saveCore(); render(); },
  bCountry() { S.core.budget.country = val('b-country'); saveCore(); toast('Saved.'); },
  bOther() { const b = S.core.budget; b.country = val('b-country'); b.cur = val('b-cur') || 'USD'; b.like = val('b-like') || 'US'; b.weekly = 0; b.tier = ''; b.ref = null; saveCore(); render(); },
  bTier(el) { const tc = tierCosts(); A.bSet(Math.ceil(tc[el.dataset.v] / 5) * 5, el.dataset.v); },
  bSave() { const v = num('b-weekly'); if (!(v > 0)) { toast('How much a week?'); return; } A.bSet(v, 'custom'); },
  bSet(v, tier) {
    const b = S.core.budget, c = priceCtx();
    b.weekly = v; b.tier = tier; b.ref = { date: S.prices.updated, idx: basketIndex(c), ids: Object.keys(R) }; b.seen = S.prices.updated; b.alert = null;
    S.core.food.swaps = {}; saveCore(); toast('Budget ' + money(v) + ' a week. Menu updated.'); render();
  },
  bRaise() { A.bSet(Math.ceil(S.core.budget.alert.cost / 5) * 5, 'custom'); },
  bKeep() { A.bSet(S.core.budget.weekly, S.core.budget.tier); },
  bSupp() { const v = num('b-supp'); S.core.budget.supp = v > 0 ? v : 0; saveCore(); render(); },
  budgetGo() { UI.food = 'budget'; go('food'); },
  // Apple Health & calendar
  async healthRefresh() { toast('Checking…'); syncPlan(true); await fetchHealth(); render(); toast(S.core.health.at ? 'Last sync ' + ago(S.core.health.at) + '.' : 'Nothing yet. Run the Shortcut once, then try again.', 3500); },
  copyLink() { try { navigator.clipboard.writeText(shortcutURL()).then(() => toast('Link copied. Paste it into Get Contents of URL.'), () => toast('Could not copy. Press and hold the link to copy it.')); } catch (e) { toast('Could not copy. Press and hold the link to copy it.'); } },
  calOn() { S.core.calOn = true; saveCore(); syncPlan(true); },
  gConnect() { S.core.gcalPending = true; saveCore(); syncPlan(true); setTimeout(render, 300); },
  async gCheck() { toast('Checking…'); await fetchGcal(); render(); toast(S.core.gcal ? 'Google Calendar connected.' : 'Not connected yet. Finish signing in with Google, then try again.', 3500); },
  async gOff() {
    try { await fetch(PUSH_URL + '/g/off', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: S.core.sid }) }); } catch (e) {}
    S.core.gcal = false; S.core.gcalPending = false; saveCore(); toast('Google Calendar disconnected. The Gym Bro calendar was removed.'); render();
  },
  calApp(el) { S.core.calApp = el.dataset.v; saveCore(); render(); },
  calCopy() { A.calOn(); try { navigator.clipboard.writeText(calHttps()).then(() => toast('Link copied. Paste it in Google Calendar → From URL.', 3500), () => toast('Press and hold the link to copy it.')); } catch (e) { toast('Press and hold the link to copy it.'); } },
};
async function importBackup(file) {
  try {
    const o = JSON.parse(await file.text());
    if (!o || o.app !== 'gym-bro' || !o.core) throw new Error('not a backup');
    S.core = o.core; S.months = o.months || {}; await loadStore(); flush();
    toast('Backup restored.'); render();
  } catch (e) { toast('That file is not a Gym Bro backup.'); }
}
async function compress(file) {
  try {
    const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
    const sc = Math.min(1, 1400 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.82));
    return blob || file;
  } catch (e) { return file; }
}
document.addEventListener('change', async e => {
  if (e.target.id === 'import-in' && e.target.files.length) { importBackup(e.target.files[0]); return; }
  if (e.target.id !== 'photo-in' || !e.target.files.length) return;
  const file = e.target.files[0]; UI.uploading = true; render();
  try {
    const blob = await compress(file), id = 'p' + Date.now();
    await photoOp('readwrite', st => st.put(blob, id));
    S.purl[id] = URL.createObjectURL(blob);
    const d = getDay(TODAY());
    S.core.photos.push({ id, d: TODAY(), pose: UI.pose, w: d && d.w ? d.w : null });
    saveCore(); toast('Photo saved. Gym Bro: "Looking less soft already. Slightly."', 3200);
  } catch (err) { toast('Could not save the photo. Try again.'); }
  UI.uploading = false; render();
});
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el) { if (e.target.id === 'sheet') { UI.sheet = null; render(); } return; }
  const fn = A[el.dataset.a]; if (fn) fn(el);
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'fa-q' && UI.sheet && UI.sheet.food) { UI.sheet.food.q = el.value; const box = $('#fa-sug'); if (box) box.innerHTML = sugHTML(el.value); return; }
  if (el.id === 'ac-min' && UI.sheet && UI.sheet.act) { const v = num('ac-min'); if (v > 0) { UI.sheet.act.min = v; const b = $('#ac-burn'); if (b) b.innerHTML = burnTxt(UI.sheet.act); } return; }
  if (!el.dataset.ex) return;
  const dr = UI.draft[el.dataset.ex] = UI.draft[el.dataset.ex] || {}; dr.w = num(el.id);
});

document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (e.target.id === 'fa-q') { e.preventDefault(); A.faParse(); }
  if (e.target.id === 'fo-q') { e.preventDefault(); A.foSearch(); }
});
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
(async () => {
  await loadStore();
  try { const c = localStorage.getItem('gymbro-prices'); if (c) S.prices = JSON.parse(c); } catch (e) {}
  ensureTodayMode();
  render();
  syncPush();
  checkUpdate();
  loadPrices().then(() => { BP = null; priceCheck(); if (!UI.sheet && (UI.tab === 'food' || UI.tab === 'today')) render(); });
  fetchHealth();
  fetchGcal();
  let lastDay = TODAY();
  setInterval(() => { if (TODAY() !== lastDay) { lastDay = TODAY(); ensureTodayMode(); } if (UI.tab === 'today' && !UI.sheet) render(); }, 5 * 60000);
  setInterval(() => { if (UI.tab === 'today' && !UI.sheet && UI.say && UI.say.until < Date.now()) { UI.say = null; render(); } }, 3000);
})();
