<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gym Bro</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gym Bro">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F4F6FB">
<meta name="color-scheme" content="light only">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Manrope:wght@500;600;700;800&display=swap">
<style>
/* Layout: one phone column, big readable type; each tab has its own bright colour (orange Today, blue Train, green Food, violet Progress) */
:root{
  --bg:#F4F6FB; --surface:#FFFFFF; --soft:#EDF0F7; --ink:#0D1220; --muted:#465065; --line:#DCE1EC;
  --orange:#FF5A1F; --orange-soft:#FFE7DC; --blue:#2563FF; --blue-soft:#DFE8FF; --green:#0FA968; --green-soft:#D6F5E7;
  --violet:#7C3AED; --violet-soft:#EDE4FF; --sun:#FFCB2B; --sun-soft:#FFF3CC; --red:#E5263B; --red-soft:#FFE0E4;
  --on-accent:#FFFFFF;
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:18px;
}
*{box-sizing:border-box}
:root{color-scheme:light only;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:500 17px/1.55 var(--body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
#app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(110px + env(safe-area-inset-bottom,0px))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:14px 10px}
.brand{font:800 22px/1.1 var(--body);flex:1;min-width:0}
.brand small{display:block;font:600 14px/1.3 var(--body);color:var(--muted);margin-top:2px}
.chip{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:800;font-size:15px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.chip .dot{width:10px;height:10px;border-radius:50%;background:var(--green)}
.chip.travel .dot{background:var(--blue)} .chip.sick .dot{background:var(--red)} .chip.break .dot{background:var(--sun)}
main{display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
h2{font:800 24px/1.2 var(--body);margin:0;text-wrap:balance}
h3{font:800 19px/1.25 var(--body);margin:0}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:15px}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.big{font:700 44px/1 var(--display);font-variant-numeric:tabular-nums}
.big small{font:700 18px var(--body);color:var(--muted);margin-left:4px}
.lbl{font-size:14px;font-weight:800;color:var(--muted)}
.bar{height:12px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--orange)}
.bar.green>i{background:var(--green)}
.btn{border:0;border-radius:14px;padding:15px 18px;font-weight:800;font-size:17px;background:var(--orange);color:var(--on-accent);text-align:center;display:inline-block}
.btn.blue{background:var(--blue)} .btn.green{background:var(--green)} .btn.violet{background:var(--violet)}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.small{padding:10px 14px;font-size:15px;border-radius:12px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
input[type=text],input[type=time],input[type=date],input:not([type]),select{background:var(--soft);border:2px solid transparent;border-radius:12px;padding:12px;min-width:0;width:100%;font-size:17px}
input[type=time],input[type=date]{-webkit-appearance:none;appearance:none;display:block;max-width:100%;min-height:50px;text-align:left}
input::-webkit-date-and-time-value{text-align:left}
input:focus,select:focus{border-color:var(--blue);outline:none}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field span{font-size:14px;font-weight:700;color:var(--muted)}
/* Tank */
.hero{background:var(--sun);border-radius:var(--r);padding:16px;display:flex;gap:14px;align-items:center;color:#1A1405}
.hero svg{width:104px;height:104px;flex:none}
.hero .say{flex:1;min-width:0}
.hero .say b{display:block;font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;opacity:.75}
.hero .say p{font:800 20px/1.3 var(--body);text-wrap:pretty}
.hero.angry{background:var(--orange);color:var(--on-accent)}
.hero.happy{background:var(--green);color:var(--on-accent)}
.hero.soft{background:var(--blue);color:var(--on-accent)}
@media (prefers-reduced-motion:no-preference){.hero svg{animation:bob 3s ease-in-out infinite}.hero.angry svg{animation:shake .5s ease-in-out 2}@keyframes bob{50%{transform:translateY(-3px)}}@keyframes shake{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}}
/* tasks */
.tasks{display:flex;flex-direction:column;gap:10px}
.task{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 15px;border-radius:15px;background:var(--soft)}
.tmain{flex:1;min-width:0;display:flex;align-items:center;gap:14px;background:none;border:0;padding:9px 0;text-align:left}
.q{width:42px;height:42px;border-radius:50%;border:2px solid var(--line);background:var(--surface);font-weight:800;font-size:18px;color:var(--blue);flex:none}
.exname{background:none;border:0;padding:0;text-align:left;flex:1;min-width:0}
.vid{font-weight:800;color:var(--red);font-size:15px}
.helpex{border-top:1px solid var(--line);padding-top:10px}
.helpex summary{font-size:16px}
.helpex ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:15px}
.sched{background:none;border:0;padding:0;text-align:left;font-weight:inherit;color:var(--blue);text-decoration:underline;text-underline-offset:3px}
.box{width:32px;height:32px;border-radius:10px;border:3px solid var(--muted);flex:none;display:grid;place-items:center;background:var(--surface)}
.box svg{width:20px;height:20px;stroke:#fff;stroke-width:3.5;fill:none;opacity:0}
.task.done{background:var(--green-soft)}
.task.done .box{background:var(--green);border-color:var(--green)}
.task.done .box svg{opacity:1}
.task .t{flex:1;min-width:0}
.task .t b{display:block;font-weight:800;font-size:17px}
.task .t span{font-size:14px;color:var(--muted)}
.streak{background:var(--orange-soft);color:var(--orange);font-weight:800;font-size:15px;padding:6px 12px;border-radius:999px}
/* banners */
.banner{border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.banner.sick{background:var(--red-soft)} .banner.travel{background:var(--blue-soft)} .banner.break{background:var(--sun-soft)} .banner.warn{background:var(--orange-soft)} .banner.good{background:var(--green-soft)}
/* segmented */
.segs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.seg{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 15px;font-weight:800;font-size:15px;white-space:nowrap}
.seg.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab-train .seg.on{background:var(--blue);border-color:var(--blue);color:var(--on-accent)}
.tab-food .seg.on{background:var(--green);border-color:var(--green);color:var(--on-accent)}
.tab-me .seg.on{background:var(--violet);border-color:var(--violet);color:var(--on-accent)}
/* gym */
.steps{counter-reset:s;display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.steps li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start}
.steps li::before{content:counter(s);width:34px;height:34px;border-radius:50%;background:var(--blue);color:var(--on-accent);font-weight:800;display:grid;place-items:center}
.steps li b{display:block}
.ex{border-radius:15px;background:var(--soft);padding:14px;display:flex;flex-direction:column;gap:10px}
.ex.main{background:var(--blue-soft)}
.ex-top{display:flex;gap:10px;align-items:flex-start}
.ex-top .n{flex:1;min-width:0}
.ex-top .n b{display:block;font-size:17px;font-weight:800}
.ex-top .n span{font-size:15px;color:var(--muted);font-weight:700}
.tag{font-size:12px;font-weight:800;background:var(--blue);color:var(--on-accent);padding:3px 8px;border-radius:6px;white-space:nowrap}
.ex-log{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}
.ex-log input{text-align:center;font-weight:800}
.hit{height:50px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:800;font-size:15px}
.hit.ok{background:var(--green);border-color:var(--green);color:var(--on-accent)}
.hit.miss{background:var(--orange);border-color:var(--orange);color:var(--on-accent)}
.how{font-size:15px;display:flex;flex-direction:column;gap:6px}
.how ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.linkbtn{border:0;background:none;padding:0;color:var(--blue);font-weight:800;font-size:15px;text-align:left}
.tab-food .linkbtn{color:var(--green)}
/* meals */
.meal{border-radius:15px;background:var(--soft);overflow:hidden}
.meal-h{display:flex;gap:12px;align-items:center;padding:14px}
.meal-h .t{flex:1;min-width:0}
.meal-h .t .slot{display:flex;gap:6px;flex-wrap:wrap;font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.meal-h .t .slot i{font-style:normal;background:var(--green);color:var(--on-accent);border-radius:6px;padding:1px 7px;text-transform:none;letter-spacing:0}
.meal-h .t .slot i.hot{background:var(--orange)} .meal-h .t .slot i.cold{background:var(--blue)}
.meal-h .t b{display:block;font-weight:800;font-size:17px;line-height:1.3}
.meal-h .t em{display:block;font-style:normal;font-size:14px;color:var(--muted)}
.meal.done{background:var(--green-soft)}
.eat{width:48px;height:48px;border-radius:14px;border:3px solid var(--muted);background:var(--surface);flex:none;display:grid;place-items:center}
.eat svg{width:22px;height:22px;stroke:var(--muted);stroke-width:3.5;fill:none}
.meal.done .eat{background:var(--green);border-color:var(--green)} .meal.done .eat svg{stroke:#fff}
.recipe{padding:0 14px 16px;display:flex;flex-direction:column;gap:10px;font-size:16px}
.recipe ul,.recipe ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:4px}
.macro{font-size:14px;font-weight:800;color:var(--muted);white-space:nowrap;text-align:right}
table{width:100%;border-collapse:collapse;font-size:16px}
td,th{padding:10px 4px;text-align:left;border-top:1px solid var(--line);vertical-align:top}
th{font-size:13px;color:var(--muted);border-top:0}
.tw{overflow-x:auto}
.shop{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.shop .box{width:28px;height:28px;border-radius:8px}
.shop.got .box{background:var(--green);border-color:var(--green)} .shop.got .box svg{opacity:1;width:16px;height:16px}
.shop.got .t{color:var(--muted);text-decoration:line-through}
.shop .t{flex:1;min-width:0;font-weight:700} .shop .q{font-weight:800;color:var(--muted);white-space:nowrap}
.aisle{font-size:14px;font-weight:800;color:var(--green);margin-top:8px}
/* goal */
.goal{background:var(--violet);color:var(--on-accent);border:0;text-align:left}
.goal .lbl{color:var(--on-accent);opacity:.85}
.goal .date{font:700 38px/1.05 var(--display);text-wrap:balance}
.goal .bar{background:rgba(255,255,255,.3)} .goal .bar>i{background:var(--on-accent)}
/* photos */
.ba{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ba figure{margin:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.ba img,.ba .ph{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:14px;background:var(--soft);display:grid;place-items:center;color:var(--muted);font-size:15px;font-weight:700;text-align:center;padding:8px}
.ba img{padding:0}
.ba figcaption{font-size:15px}
.gal{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.gal div{position:relative}
.gal img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;display:block}
.gal span{position:absolute;left:4px;bottom:4px;font-size:11px;font-weight:800;background:rgba(0,0,0,.65);color:#fff;padding:2px 5px;border-radius:5px}
.gal button{position:absolute;right:3px;top:3px;min-width:26px;height:26px;border-radius:13px;border:0;background:rgba(0,0,0,.65);color:#fff;font-weight:800;line-height:1;font-size:13px}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
/* chart */
svg.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .cl{fill:var(--muted);font:700 11px var(--body)}
.chart .raw{fill:var(--muted);opacity:.5}
.chart .raw.ex{fill:none;stroke:var(--muted);stroke-width:1}
.chart .avg{fill:none;stroke:var(--violet);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.chart .end{fill:var(--violet)}
.chart .gl{stroke:var(--green);stroke-dasharray:5 4;stroke-width:2}
.chart .gt{fill:var(--green);font:800 11px var(--body)}
details summary{cursor:pointer;font-weight:800;font-size:17px;list-style:none;display:flex;justify-content:space-between;align-items:center}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"+";color:var(--muted);font-size:24px;line-height:1} details[open] summary::after{content:"–"}
details[open] summary{margin-bottom:12px}
/* nav */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{border:0;background:none;padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px;font-weight:800;color:var(--muted)}
.tabs svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on[data-v=today]{color:var(--orange)} .tabs button.on[data-v=train]{color:var(--blue)} .tabs button.on[data-v=food]{color:var(--green)} .tabs button.on[data-v=me]{color:var(--violet)}
#sheet{position:fixed;inset:0;z-index:20;background:rgba(5,8,12,.55);display:flex;align-items:flex-end;justify-content:center}
#sheet .in{background:var(--bg);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:20px max(16px,env(safe-area-inset-left,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px;max-height:88vh;overflow-y:auto}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:15px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:2px}
.opt.on{border-color:var(--orange)}
.opt b{font-weight:800;font-size:17px} .opt span{font-size:15px;color:var(--muted)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:13px 18px;border-radius:14px;font-weight:800;font-size:16px;max-width:calc(100% - 32px);text-align:center}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
@media (max-width:380px){.hero svg{width:84px;height:84px}.hero .say p{font-size:18px}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">Gym Bro<small id="sub">Loading…</small></div>
    <button class="chip" id="modeChip" data-a="mode" aria-label="Change mode"><span class="dot"></span><span id="modeLabel">Normal</span></button>
  </header>
  <main id="view"><div class="loading">Tank is waking up…</div></main>
</div>
<nav class="tabs" aria-label="Sections"><div>
  <button data-a="tab" data-v="today"><svg viewBox="0 0 24 24"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg>Today</button>
  <button data-a="tab" data-v="train"><svg viewBox="0 0 24 24"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>Gym</button>
  <button data-a="tab" data-v="food"><svg viewBox="0 0 24 24"><path d="M4 11h16a8 8 0 0 1-16 0z"/><path d="M8 7c0-1.5 1-2 1-3M12 7c0-1.5 1-2 1-3M16 7c0-1.5 1-2 1-3"/></svg>Food</button>
  <button data-a="tab" data-v="me"><svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/></svg>Progress</button>
</div></nav>
<div id="sheet" hidden></div>
<div id="toast" hidden></div>

<script>
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const keyOf = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parseKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate() + n); return keyOf(d); };
const diffDays = (a, b) => Math.round((parseKey(a) - parseKey(b)) / 864e5);
const TODAY = () => keyOf(new Date());
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => Math.round(n).toLocaleString('en-GB');
const toMin = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const round = (n, step) => Math.round(n / step) * step;
const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const shortDate = k => { const d = parseKey(k); return d.getDate() + ' ' + d.toLocaleString('en-GB', { month: 'short' }); };
const longDate = k => parseKey(k).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
const weekStart = k => { const d = parseKey(k); return addDays(k, -((d.getDay() + 6) % 7)); };
const CHECK = '<svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg>';
const pick = (arr, seed) => arr[((seed % arr.length) + arr.length) % arr.length];

/* ---------- gym program ---------- */
// how: 3 coaching steps; main lifts rest 2–3 min, the rest 60–90 s
const EX = {
  bench: { n: 'Bench press', sets: 4, lo: 5, hi: 8, inc: 2.5, start: 62.5, main: true, how: ['Lie with your eyes under the bar, feet flat, squeeze your shoulder blades together.', 'Lower the bar to mid-chest in 2 seconds, elbows about 45° from your body.', 'Press up. Set the safety bars or ask for a spot.'] },
  wpull: { n: 'Weighted pull-up', sets: 4, lo: 5, hi: 8, inc: 2.5, start: 7.5, main: true, note: 'kg on a dip belt', how: ['Dip belt with a plate. Hang with straight arms, hands a bit wider than shoulders.', 'Pull your chest to the bar, elbows down to your ribs.', 'Lower all the way in 2 seconds. No swinging.'] },
  idb: { n: 'Incline dumbbell press', sets: 3, lo: 8, hi: 12, inc: 2, start: 24, note: 'kg per dumbbell', how: ['Bench at 30°. Dumbbells at your chest, palms forward.', 'Press up and slightly together.', 'Lower slowly until you feel a stretch in your chest.'] },

  if (qn) return { mood: 'angry', msg: fill(pick(TANK.quiet, seed)) };

function chart(series, goal) {
  if (series.length < 2) return '<p class="small muted">Two weigh-ins and your chart appears.</p>';
  const pts = series.slice(-60), clean = series.filter(x => !x.ex);
  const first = pts[0].k, last = pts[pts.length - 1].k, span = Math.max(1, diffDays(last, first));
  const ws = pts.map(p => p.w).concat([goal]);
  const lo = Math.floor(Math.min(...ws) - 0.5), hi = Math.ceil(Math.max(...ws) + 0.5);
  const W = 340, H = 170, L = 36, Rr = 10, Tp = 12, B = 24;
  const x = k => L + diffDays(k, first) / span * (W - L - Rr);
  const y = w => Tp + (hi - w) / (hi - lo) * (H - Tp - B);
  const avg = pts.filter(p => !p.ex).map(p => [p.k, trendAt(p.k, clean)]).filter(p => p[1] !== null);
  const path = avg.map((p, i) => (i ? 'L' : 'M') + x(p[0]).toFixed(1) + ' ' + y(p[1]).toFixed(1)).join(' ');
  const end = avg[avg.length - 1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight trend">
    ${[lo, (lo + hi) / 2, hi].map(t => `<line class="grid" x1="${L}" x2="${W - Rr}" y1="${y(t)}" y2="${y(t)}"/><text class="cl" x="${L - 5}" y="${y(t) + 4}" text-anchor="end">${t.toFixed(1)}</text>`).join('')}
    <line class="gl" x1="${L}" x2="${W - Rr}" y1="${y(goal)}" y2="${y(goal)}"/><text class="gt" x="${W - Rr}" y="${y(goal) - 5}" text-anchor="end">goal ${goal}</text>
    ${pts.map(p => `<circle class="raw ${p.ex ? 'ex' : ''}" cx="${x(p.k).toFixed(1)}" cy="${y(p.w).toFixed(1)}" r="3"/>`).join('')}
    ${avg.length > 1 ? `<path class="avg" d="${path}"/>` : ''}
    ${end ? `<circle class="end" cx="${x(end[0]).toFixed(1)}" cy="${y(end[1]).toFixed(1)}" r="5"/>` : ''}
    <text class="cl" x="${L}" y="${H - 6}">${shortDate(first)}</text><text class="cl" x="${W - Rr}" y="${H - 6}" text-anchor="end">${shortDate(last)}</text>
  </svg><p class="small muted">Dots are daily weigh-ins, the line is your 7-day average. Watch the line.</p>`;
}

  if (v('steps') === 'hi') wins.push('Over 9,000 steps.');
  if (dk > 150) fixes.push('About ' + fmt(dk) + ' kcal over target.');
  if (dk < -500) fixes.push('About ' + fmt(-dk) + ' kcal under target. Too little eats your muscle.');
  if (e.p < T.protein) fixes.push('Protein short by ' + (T.protein - e.p) + ' g.');
  if (tr === 'skip') fixes.push(dayMode(k) === 'sick' ? 'Trained while ill. Stop it.' : 'Skipped training.');
  if (v('steps') === 'lo') fixes.push('Under 5,000 steps.');
  if (v('sleep') === 'lo') fixes.push('Under 6 hours of sleep.');
  if (v('creatine') === 'no') fixes.push('Forgot creatine.');
  tomorrow.push(tomSession + (tr === 'skip' && SESS[tp] ? '. No skipping twice in a row.' : '.'));
  if (e.p < T.protein) tomorrow.push('Eat the skyr and the shake: that alone is 63 g of protein.');
  if (dk > 150) tomorrow.push('Only the 5 planned meals. Nothing after dinner.');
  if (dk < -500) tomorrow.push('Eat every planned meal. Don\'t skip breakfast.');
  if (v('steps') !== 'hi') tomorrow.push('Walk 20 minutes after lunch.');
  if (v('sleep') !== 'hi') tomorrow.push('Screens off at ' + fromMin(toMin(s.sleep) - 30) + ', lights out at ' + s.sleep + '.');
  if (v('creatine') === 'no') tomorrow.push('Creatine with breakfast at ' + fromMin(toMin(s.wake) + 30) + '.');
  if (v('hunger') === 'hi') tomorrow.push('Hungry? Double the veg and add a second skyr, not snacks.');
  const headline = score >= 85 ? 'Annoyingly good day. I have nothing to yell about.' : score >= 65 ? 'Decent. Not great. I\'ve seen worse. Barely.' : score >= 40 ? 'Meh. Fix it tomorrow or I eat your trainers.' : 'That was a disaster. Good news: tomorrow exists.';
  const okList = x => Array.isArray(x) && x.length && x.every(y => typeof y === 'string');
  return {
    score, kcal: e.kcal, p: e.p, tk: T.kcal, tp: T.protein, weekly, predDate, planDate: goalInfo().date, tomSession, waterJump: dk > 300 || (a.extra && a.extra.v === 'else' && a.extra.size === 'big'),
    headline: ai && typeof ai.headline === 'string' ? ai.headline : headline,
    wins: ai && okList(ai.wins) ? ai.wins.slice(0, 3) : wins.slice(0, 3).concat(wins.length ? [] : ['You opened the app. That\'s it. That\'s the win.']),
    fixes: ai && okList(ai.fixes) ? ai.fixes.slice(0, 3) : fixes.slice(0, 3).concat(fixes.length ? [] : ['Nothing. Suspicious. Do it again tomorrow.']),
    tomorrow: ai && okList(ai.tomorrow) ? ai.tomorrow.slice(0, 3) : tomorrow.slice(0, 4),
    ai: !!ai,
  };
}
const fromMin = m => { m = ((m % 1440) + 1440) % 1440; return pad(Math.floor(m / 60)) + ':' + pad(m % 60); };

  </div>
  <div class="card">
    <h3>What went well</h3><ul class="small" style="margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px">${rep.wins.map(x => `<li>${esc(x)}</li>`).join('')}</ul>
    <h3>What to fix</h3><ul class="small" style="margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px">${rep.fixes.map(x => `<li>${esc(x)}</li>`).join('')}</ul>

async function importBackup(file) {
  try {
    const o = JSON.parse(await file.text());
    if (!o || o.app !== 'gym-bro' || !o.core) throw new Error('not a backup');
    S.core = o.core; S.months = o.months || {}; flush(); await loadPhotoURLs();
    toast('Backup restored.'); render();
  } catch (e) { toast('That file is not a Gym Bro backup.'); }
}
function keepDraft() {
  document.querySelectorAll('[data-ex]').forEach(el => { const dr = UI.draft[el.dataset.ex] = UI.draft[el.dataset.ex] || {}; dr.w = num(el.id); });
}
async function compress(file) {
  try {
    const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
    const sc = Math.min(1, 1400 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.82));
    return blob || file;
  } catch (e) { return file; }
}
document.addEventListener('change', async e => {

  const file = e.target.files[0]; UI.uploading = true; render();
